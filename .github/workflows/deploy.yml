name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_data:
        description: SchaleDB에서 학생 데이터와 아이콘을 다시 받기
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Update data
        if: ${{ inputs.update_data }}
        run: |
          node scripts/update-data.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/students.json img/students
          git diff --cached --quiet || { git commit -m "Update student data"; git push; }

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html favicon.svg assets img _site/
          mkdir _site/data
          cp data/students.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
